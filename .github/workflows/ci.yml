name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic python-dotenv requests

      - name: Compile Python files
        run: |
          python -m py_compile api/main.py
          python -m py_compile benchmarks/benchmark.py
          python -m py_compile scripts/verify_gpu_inference.py
